<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Kantymamiratra</title>
<meta name="robots" content="noindex">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222}
header{background:#333;color:#fff;padding:14px 16px}
main{max-width:640px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin:4px 0}
button{background:#1a73e8;color:#fff;border:0}
button.ok{background:#2e7d32}button.no{background:#c62828}
.hide{display:none}
</style>
</head>
<body>
<header><b>🔐 Admin</b></header>
<main>
  <div id="auth" class="card">
    <input id="email" type="email" placeholder="Email Admin">
    <input id="pass" type="password" placeholder="Teny miafina">
    <button id="login">Midira</button>
    <p id="msg" style="color:#c00"></p>
  </div>

  <div id="panel" class="hide">
    <div class="card">
      <h3>Hanampy boky</h3>
      <input id="t" placeholder="Lohateny">
      <input id="p" type="number" placeholder="Vidiny (Ar)">
      <input id="c" placeholder="Rohy sary fonosana (URL)">
      <input id="f" placeholder="Rohy PDF (tsy ampahibemaso: Drive/R2)">
      <button id="add">Ampiana</button>
    </div>
    <h3>Baiko miandry</h3>
    <div id="orders"></div>
  </div>
</main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, setDoc, updateDoc, getDoc, doc, query, where }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("login").onclick = () => signInWithEmailAndPassword(auth, $("email").value, $("pass").value).catch(e => $("msg").textContent = e.message);

onAuthStateChanged(auth, async user => {
  if (!user) return;
  const adm = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!adm || !adm.exists()) { $("msg").textContent = "Tsy Admin ity kaonty ity."; return; }
  $("auth").classList.add("hide"); $("panel").classList.remove("hide");
  loadOrders();
});

$("add").onclick = async () => {
  const ref = await addDoc(collection(db, "books"), { title: $("t").value, price: Number($("p").value), cover: $("c").value });
  await setDoc(doc(db, "bookFiles", ref.id), { pdfUrl: $("f").value });
  alert("Voampy"); ["t","p","c","f"].forEach(i => $(i).value = "");
};

async function loadOrders() {
  const snap = await getDocs(query(collection(db, "orders"), where("status", "==", "pending")));
  $("orders").innerHTML = snap.empty ? "<p>Tsy misy baiko miandry.</p>" : "";
  snap.forEach(d => {
    const o = d.data();
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<b>${esc(o.bookTitle)}</b> — ${esc(o.amount)} Ar<br>
      ${esc(o.email)}<br>Tel: ${esc(o.phone)}<br>Réf: <b>${esc(o.mvolaRef)}</b>
      <button class="ok">Valider</button><button class="no">Refuser</button>`;
    el.querySelector(".ok").onclick = async () => {
      const f = await getDoc(doc(db, "bookFiles", o.bookId));
      if (!f.exists()) return alert("Tsy misy rohy PDF ho an'ity boky ity");
      await setDoc(doc(db, "deliveries", d.id), { uid: o.uid, pdfUrl: f.data().pdfUrl });
      await updateDoc(doc(db, "orders", d.id), { status: "paid" });
      loadOrders();
    };
    el.querySelector(".no").onclick = async () => { await updateDoc(doc(db, "orders", d.id), { status: "rejected" }); loadOrders(); };
    $("orders").appendChild(el);
  });
}
</script>
</body>
</html>
