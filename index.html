<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantymamiratra · Boky PDF</title>
<meta name="description" content="Fivarotana boky PDF. Mividy amin'ny MVola ary alao avy hatrany ny boky.">
<meta name="theme-color" content="#b4532a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap row">
    <a class="brand" href="./" id="home"><span class="logo">📖</span>Kantymamiratra</a>
    <div class="grow"></div>
    <button class="btn ghost sm hide" id="btnOrders">Baiko</button>
    <button class="btn sm" id="btnAcct">Midira</button>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner hide">
    <span style="font-size:26px">📱</span>
    <div class="grow"><b>Alao ny application</b><span class="muted small">Haingana kokoa ary mora tadiavina</span></div>
    <a class="btn sm" id="apkLink" href="https://github.com/tongitakavolasoambola-code/kantymamiratra/releases/latest/download/app.apk">Android</a>
    <button class="btn ghost sm hide" id="pwaBtn">Apetaho</button>
    <button class="x" id="bannerX" aria-label="Akatony">×</button>
  </div>

  <section id="catalog">
    <div class="hero">
      <h1>Boky PDF, alaina avy hatrany.</h1>
      <p>Mividy amin'ny MVola, ary rehefa voamarina ny fandoavanao dia hiseho ao amin'ny kaontinao ny boky.</p>
      <div class="search"><span>🔎</span><input id="q" type="search" placeholder="Hitady boky na mpanoratra…" autocomplete="off"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="ordersView" class="hide">
    <div class="row" style="padding:20px 0 10px"><h2 style="margin:0">Ny baiko nataoko</h2><div class="grow"></div><button class="btn ghost sm" id="refresh">Havaozy</button></div>
    <div id="orders"></div>
  </section>
</main>

<footer><div class="wrap">© Kantymamiratra · Fandoavana amin'ny MVola</div></footer>

<div id="sheet" class="sheet hide"><div class="bg" id="sheetBg"></div><div class="panel"><button class="close" id="sheetX" aria-label="Akatony">×</button><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script type="module">
import { firebaseConfig, MVOLA_NUMBER } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, query, where, getDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";
const money = n => Number(n || 0).toLocaleString("fr-FR") + " Ar";
const store = { get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{} } };

const state = { user: null, books: [], cat: "Rehetra", q: "", after: null };

const ERR = {
  "auth/invalid-credential": "Diso ny email na ny teny miafina.",
  "auth/invalid-email": "Tsy mety ny email.",
  "auth/missing-password": "Soraty ny teny miafina.",
  "auth/email-already-in-use": "Efa misy kaonty amin'io email io.",
  "auth/weak-password": "Fohy loatra ny teny miafina (6 litera farafahakeliny).",
  "auth/network-request-failed": "Tsy misy internet.",
  "auth/too-many-requests": "Be loatra ny andrana. Miandrasa kely dia avereno.",
  "permission-denied": "Tsy mahazo manao izany."
};
const errMsg = e => ERR[e.code] || ("Nisy hadisoana: " + (e.code || e.message));

function toast(msg){
  const d = document.createElement("div"); d.textContent = msg; $("toast").appendChild(d);
  setTimeout(() => d.remove(), 3200);
}

/* ---------- Sheet ---------- */
function openSheet(html, mount){ $("sheetBody").innerHTML = html; $("sheet").classList.remove("hide"); if (mount) mount(); }
function closeSheet(){ $("sheet").classList.add("hide"); $("sheetBody").innerHTML = ""; }
$("sheetBg").onclick = closeSheet; $("sheetX").onclick = closeSheet;
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Books ---------- */
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function coverEl(b){
  const h = hue(b.title || ""), u = safeUrl(b.cover);
  const bg = `linear-gradient(135deg,hsl(${h} 45% 38%),hsl(${(h + 40) % 360} 50% 26%))`;
  return `<div class="cover" style="background:${bg}"><span>${esc((b.title || "?").trim().slice(0, 1).toUpperCase())}</span>${u ? `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
}

function renderChips(){
  const cats = ["Rehetra", ...new Set(state.books.map(b => (b.category || "").trim()).filter(Boolean))];
  $("chips").innerHTML = cats.length > 1 ? cats.map(c => `<button class="chip ${c === state.cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") : "";
}
function renderGrid(){
  const q = state.q.trim().toLowerCase();
  const list = state.books.filter(b =>
    (state.cat === "Rehetra" || (b.category || "").trim() === state.cat) &&
    (!q || (b.title || "").toLowerCase().includes(q) || (b.author || "").toLowerCase().includes(q)));
  $("grid").innerHTML = list.length ? list.map(b => `
    <article class="book" data-id="${esc(b.id)}">${coverEl(b)}
      <div class="info"><h3>${esc(b.title)}</h3><div class="au">${esc(b.author || "")}</div>
      <div class="bt"><span class="price">${money(b.price)}</span><button class="btn sm" data-buy="${esc(b.id)}">Hividy</button></div></div>
    </article>`).join("") : `<div class="empty" style="grid-column:1/-1">Tsy nahita boky.</div>`;
}
$("grid").onclick = e => {
  const buy = e.target.closest("[data-buy]"), card = e.target.closest("[data-id]");
  const id = buy ? buy.dataset.buy : card && card.dataset.id;
  const b = state.books.find(x => x.id === id); if (!b) return;
  buy ? startBuy(b) : openDetail(b);
};
$("chips").onclick = e => { const c = e.target.closest("[data-c]"); if (!c) return; state.cat = c.dataset.c; renderChips(); renderGrid(); };
$("q").oninput = e => { state.q = e.target.value; renderGrid(); };

async function loadBooks(){
  const cached = store.get("kmt_books");
  if (cached) { try { state.books = JSON.parse(cached); renderChips(); renderGrid(); } catch {} }
  else $("grid").innerHTML = Array(6).fill('<div class="skel"></div>').join("");
  try {
    const snap = await getDocs(collection(db, "books"));
    state.books = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    store.set("kmt_books", JSON.stringify(state.books.map(b => ({ ...b, createdAt: b.createdAt ? { seconds: b.createdAt.seconds } : null }))));
    renderChips(); renderGrid();
  } catch (e) {
    if (!state.books.length) $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">Tsy afaka naka ny boky. Hamarino ny internet.</div>`;
  }
}

function openDetail(b){
  openSheet(`<div class="detail">${coverEl(b)}<h2>${esc(b.title)}</h2>
    <p class="muted">${esc(b.author || "")}${b.category ? " · " + esc(b.category) : ""}</p>
    ${b.description ? `<p>${esc(b.description)}</p>` : ""}
    <div class="row" style="margin-top:14px"><strong class="price" style="font-size:22px">${money(b.price)}</strong><div class="grow"></div><button class="btn" id="goBuy">Hividy</button></div></div>`,
    () => $("goBuy").onclick = () => startBuy(b));
}

/* ---------- Auth ---------- */
function openAuth(after){
  state.after = after || null;
  let mode = "in";
  const render = () => openSheet(`
    <h2>${mode === "in" ? "Midira" : "Hamorona kaonty"}</h2>
    <p class="muted small">Ilaina ny kaonty mba hitahiry ny baikonao sy ny bokinao.</p>
    <div class="tabs"><button data-m="in" class="${mode === "in" ? "on" : ""}">Midira</button><button data-m="up" class="${mode === "up" ? "on" : ""}">Kaonty vaovao</button></div>
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="aPass" type="password" placeholder="Teny miafina (6+ litera)" autocomplete="${mode === "in" ? "current-password" : "new-password"}">
    <button class="btn block" id="aGo" style="margin-top:8px">${mode === "in" ? "Midira" : "Hamorona kaonty"}</button>
    <p id="aErr" style="color:var(--bad);font-size:14px;margin-top:10px"></p>
    ${mode === "in" ? `<button class="btn ghost sm" id="aForgot">Adino ny teny miafina?</button>` : ""}`,
    () => {
      document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
      $("aGo").onclick = async () => {
        $("aErr").textContent = ""; $("aGo").disabled = true;
        try {
          const f = mode === "in" ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
          await f(auth, $("aEmail").value.trim(), $("aPass").value);
        } catch (e) { $("aErr").textContent = errMsg(e); $("aGo").disabled = false; }
      };
      if ($("aForgot")) $("aForgot").onclick = async () => {
        const em = $("aEmail").value.trim(); if (!em) { $("aErr").textContent = "Soraty aloha ny email."; return; }
        try { await sendPasswordResetEmail(auth, em); toast("Alefa ao amin'ny email ny rohy fanovana."); } catch (e) { $("aErr").textContent = errMsg(e); }
      };
    });
  render();
}
function openAccount(){
  openSheet(`<h2>Kaontiko</h2><p class="muted">${esc(state.user.email)}</p>
    <button class="btn block" id="myOrd">Ny baiko nataoko</button>
    <button class="btn ghost block" id="out" style="margin-top:8px">Hiala</button>`,
    () => { $("myOrd").onclick = () => { closeSheet(); showOrders(); }; $("out").onclick = async () => { await signOut(auth); closeSheet(); showCatalog(); toast("Tafaboaka"); }; });
}
$("btnAcct").onclick = () => state.user ? openAccount() : openAuth();
$("btnOrders").onclick = showOrders;
$("home").onclick = e => { e.preventDefault(); showCatalog(); };

onAuthStateChanged(auth, user => {
  state.user = user;
  $("btnAcct").textContent = user ? "Kaontiko" : "Midira";
  $("btnAcct").classList.toggle("ghost", !!user);
  $("btnOrders").classList.toggle("hide", !user);
  if (user) {
    closeSheet();
    const fn = state.after; state.after = null; if (fn) fn();
  } else showCatalog();
});

/* ---------- Buy ---------- */
function startBuy(b){
  if (!state.user) { openAuth(() => startBuy(b)); return; }
  openSheet(`<h2>Hividy: ${esc(b.title)}</h2>
    <ol class="steps">
      <li><b>Alefaso ny ${money(b.price)} amin'ny MVola</b>
        <div class="numbox"><span>${esc(MVOLA_NUMBER)}</span><button class="btn ghost sm" id="cp">Kopia</button></div></li>
      <li><b>Fenoy ny momba ny fandoavana</b>
        <input id="bPhone" type="tel" inputmode="tel" placeholder="Laharana MVola nandefa">
        <input id="bRef" placeholder="Référence transaction (ao amin'ny SMS MVola)"></li>
      <li><b>Alefaso ny baiko</b></li>
    </ol>
    <button class="btn block" id="bSend">Alefa ny baiko</button>
    <p class="muted small" style="margin-top:10px">Hojerena ny SMS MVola. Rehefa voamarina dia hiseho ao amin'ny « Baiko » ny rohy hanaovana ny boky.</p>`,
    () => {
      $("cp").onclick = async () => { try { await navigator.clipboard.writeText(MVOLA_NUMBER.replace(/\s/g, "")); toast("Voakopia ny laharana"); } catch { toast("Tsy afaka nakopia: soraty tanana"); } };
      $("bSend").onclick = async () => {
        const phone = $("bPhone").value.trim(), ref = $("bRef").value.trim();
        if (phone.replace(/\D/g, "").length < 9) return toast("Soraty tsara ny laharana MVola.");
        if (ref.length < 5) return toast("Soraty ny référence transaction.");
        $("bSend").disabled = true;
        try {
          await addDoc(collection(db, "orders"), {
            uid: state.user.uid, email: state.user.email, bookId: b.id, bookTitle: b.title,
            amount: Number(b.price), phone, mvolaRef: ref, status: "pending", createdAt: serverTimestamp()
          });
          closeSheet(); toast("Voaray ny baikonao ✅"); showOrders();
        } catch (e) { toast(errMsg(e)); $("bSend").disabled = false; }
      };
    });
}

/* ---------- Orders ---------- */
const LBL = { pending: "Miandry fanamarinana", paid: "Voamarina", rejected: "Nolavina" };
function showCatalog(){ $("ordersView").classList.add("hide"); $("catalog").classList.remove("hide"); }
function showOrders(){
  if (!state.user) return openAuth(showOrders);
  $("catalog").classList.add("hide"); $("ordersView").classList.remove("hide"); scrollTo(0, 0); loadOrders();
}
$("refresh").onclick = () => loadOrders();
async function loadOrders(){
  const box = $("orders"); box.innerHTML = '<div class="skel" style="aspect-ratio:5/1"></div>';
  try {
    const snap = await getDocs(query(collection(db, "orders"), where("uid", "==", state.user.uid)));
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    await Promise.all(list.map(async o => {
      if (o.status !== "paid") return;
      try { const s = await getDoc(doc(db, "deliveries", o.id)); if (s.exists()) o.pdfUrl = s.data().pdfUrl; } catch {}
    }));
    box.innerHTML = list.length ? list.map(o => {
      const u = safeUrl(o.pdfUrl), dt = o.createdAt ? new Date(o.createdAt.seconds * 1000).toLocaleDateString("fr-FR") : "";
      return `<div class="card ord"><div class="t"><div><b>${esc(o.bookTitle)}</b><div class="muted small">${money(o.amount)} · ${dt}</div></div><span class="tag ${esc(o.status)}">${LBL[o.status] || esc(o.status)}</span></div>
        ${o.status === "paid" && u ? `<a class="btn block" style="margin-top:12px" href="${esc(u)}" target="_blank" rel="noopener">⬇ Sokafy / alaina ny PDF</a>` : ""}
        ${o.status === "pending" ? `<p class="muted small" style="margin:10px 0 0">Miandry ny fanamarinana ny fandoavana. Avereno jerena afaka fotoana fohy.</p>` : ""}
        ${o.status === "rejected" ? `<p class="muted small" style="margin:10px 0 0">Tsy hita ny fandoavana. Hamarino ny référence dia manaova baiko vaovao.</p>` : ""}</div>`;
    }).join("") : `<div class="empty">Tsy mbola misy baiko.</div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; }
}

/* ---------- Install banner ---------- */
const inApp = /KantyApp/.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isAndroid = /Android/i.test(navigator.userAgent);
let deferred = null;
function showBanner(){
  if (inApp || standalone || store.get("kmt_banner") === "x") return;
  if (!isAndroid && !deferred) return;
  $("banner").classList.remove("hide");
  $("apkLink").classList.toggle("hide", !isAndroid);
  $("pwaBtn").classList.toggle("hide", !deferred);
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; showBanner(); });
$("pwaBtn").onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("banner").classList.add("hide"); };
$("bannerX").onclick = () => { store.set("kmt_banner", "x"); $("banner").classList.add("hide"); };
showBanner();

loadBooks();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
